name: Daily OpenRouter price snapshot

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Fetch prices
        run: uv run --python 3.12 python scripts/fetch_prices.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: OpenRouter snapshot $(date -u +%F)"
            git push
          fi
